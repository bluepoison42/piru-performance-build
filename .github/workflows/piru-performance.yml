name: Build Piru performance test
on:
  workflow_dispatch:
    inputs:
      cache_only:
        description: Run persistence, migration and app regressions before building
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cache-regression:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host macro compatibility
        run: python3 ci/perf/query-tests/prepare_host.py
      - name: Test the actual PortableData models and medication services
        run: swift test --package-path android/Compat --jobs 2
      - name: Fetch and verify the bundled substance database
        run: bash pipeline/fetch-db.sh
      - name: Run the upstream app tests and native import regressions
        run: |
          set -o pipefail
          xcodebuild -scheme Piru -destination 'platform=iOS Simulator,name=iPhone 17 Pro' test > "$RUNNER_TEMP/app-tests.log" 2>&1 || { tail -100 "$RUNNER_TEMP/app-tests.log"; exit 1; }
          tail -40 "$RUNNER_TEMP/app-tests.log"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/app-tests.log
          if-no-files-found: ignore
          retention-days: 7
  android:
    needs: cache-regression
    if: ${{ !inputs.cache_only }}
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      PIRU_CONFIG: release
      PIRU_UNSIGNED: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up pinned native Android build tools
        run: zsh ci/perf/setup_ci.zsh
      - name: Fetch and verify the bundled substance database
        run: bash pipeline/fetch-db.sh
      - name: Build optimized Swift and Kotlin bridges
        shell: zsh {0}
        run: |
          source android/tools/env.sh
          zsh android/tools/build-app.sh --jobs 4
      - name: Package the unsigned release APK
        shell: zsh {0}
        run: |
          zsh android/tools/package-apk.sh
          mkdir -p deliverables
          cp "$PIRU_ANDROID/stage/.build/Android/app/outputs/apk/release/app-release-unsigned.apk" deliverables/Piru-Perf-1.6.1-70015-unsigned.apk
      - name: Upload the dependency lock used by the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies
          path: ${{ runner.temp }}/piru-android/stage/Package.resolved
          if-no-files-found: ignore
          retention-days: 7
      - name: Package an isolated app for destructive fixture tests
        shell: zsh {0}
        run: |
          source android/tools/env.sh
          cd "$PIRU_ANDROID/stage/Android"
          SKIP_BRIDGE_ANDROID_BUILD_DISABLED=1 SKIP_BRIDGE_ROBOLECTRIC_BUILD_DISABLED=1 zsh "$GITHUB_WORKSPACE/android/tools/gradle.sh" :app:assembleAudit --console=plain > "$PIRU_ANDROID/build/audit-gradle.log" 2>&1 || { tail -80 "$PIRU_ANDROID/build/audit-gradle.log"; exit 1; }
          cp "$PIRU_ANDROID/stage/.build/Android/app/outputs/apk/audit/app-audit.apk" "$GITHUB_WORKSPACE/deliverables/Piru-Audit-70015.apk"
          shasum -a 256 "$GITHUB_WORKSPACE"/deliverables/*.apk > "$GITHUB_WORKSPACE/deliverables/SHA256SUMS.txt"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piru-performance-apk
          path: deliverables/
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ runner.temp }}/piru-android/build/*.log
            ${{ runner.temp }}/piru-android/build/*.errors
          if-no-files-found: ignore
          retention-days: 7
