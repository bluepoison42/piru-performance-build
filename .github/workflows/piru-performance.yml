name: Build Piru performance test
on:
  workflow_dispatch:
    inputs:
      cache_only:
        description: Run persistence, migration and app regressions before building
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  cache-regression:
    if: ${{ inputs.cache_only }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host macro compatibility
        run: python3 ci/perf/query-tests/prepare_host.py
      - name: Test the actual PortableData models and medication services
        run: swift test --package-path android/Compat --jobs 2
      - name: Fetch and verify the bundled substance database
        run: bash pipeline/fetch-db.sh
      - name: Run the upstream app tests and native import regressions
        run: |
          set -o pipefail
          xcodebuild -scheme Piru -destination 'platform=iOS Simulator,name=iPhone 17 Pro' test > "$RUNNER_TEMP/app-tests.log" 2>&1 || { tail -100 "$RUNNER_TEMP/app-tests.log"; exit 1; }
          tail -40 "$RUNNER_TEMP/app-tests.log"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/app-tests.log
          if-no-files-found: ignore
          retention-days: 7
  android:
    if: ${{ !inputs.cache_only }}
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      PIRU_CONFIG: release
      PIRU_UNSIGNED: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Require successful tests for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/piru-performance.yml/runs?head_sha=$GITHUB_SHA&status=success&event=workflow_dispatch" > "$RUNNER_TEMP/prior-runs.json"
          python3 - <<'PY'
          import json, os, subprocess
          runs = json.load(open(os.environ['RUNNER_TEMP'] + '/prior-runs.json'))['workflow_runs']
          for run in runs:
              jobs = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run['id']}/jobs"]))['jobs']
              if any(j['name'] == 'cache-regression' and j['conclusion'] == 'success' for j in jobs):
                  print('Validated test run:', run['html_url'])
                  break
          else:
              raise SystemExit('Run cache_only=true successfully on this commit first')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up pinned native Android build tools
        run: zsh ci/perf/setup_ci.zsh
      - name: Fetch and verify the bundled substance database
        run: bash pipeline/fetch-db.sh
      - name: Build optimized Swift and Kotlin bridges
        shell: zsh {0}
        run: |
          source android/tools/env.sh
          zsh android/tools/build-app.sh --jobs 4
      - name: Package the unsigned release APK
        shell: zsh {0}
        run: |
          zsh android/tools/package-apk.sh
          mkdir -p deliverables
          cp "$PIRU_ANDROID/stage/.build/Android/app/outputs/apk/release/app-release-unsigned.apk" deliverables/Piru-Perf-1.6.1-70012-unsigned.apk
          shasum -a 256 deliverables/*.apk > deliverables/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piru-performance-apk
          path: deliverables/
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ runner.temp }}/piru-android/build/*.log
            ${{ runner.temp }}/piru-android/build/*.errors
          if-no-files-found: ignore
          retention-days: 7
